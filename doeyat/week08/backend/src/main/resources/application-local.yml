# 로컬 실습 전용: 종료하면 데이터와 토큰 서명 키가 초기화됩니다.
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:doeyat-week07;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
server:
  address: 127.0.0.1
jwt:
  secret: ${random.uuid}${random.uuid}
  access-expiration: 3600
