<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestJS API 테스트</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 20px;
        background: #f6f7f9;
        font-family: Arial, sans-serif;
        color: #17191e;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 28px;
      }

      .description {
        margin-bottom: 30px;
        color: #6b7280;
        font-size: 14px;
      }

      .card {
        background: white;
        padding: 24px;
        margin-bottom: 20px;
        border: 1px solid #e3e6eb;
        border-radius: 12px;
      }

      .card h2 {
        margin-top: 0;
        font-size: 18px;
      }

      .endpoint {
        margin-bottom: 16px;
        font-size: 13px;
        color: #2563eb;
      }

      .input-group {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        min-width: 0;
        height: 42px;
        padding: 0 12px;
        border: 1px solid #e3e6eb;
        border-radius: 8px;
        font-size: 14px;
      }

      button {
        height: 42px;
        padding: 0 18px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .result {
        margin-top: 16px;
        padding: 14px;
        background: #f6f7f9;
        border-radius: 8px;
        font-size: 13px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        min-height: 48px;
      }

      .success {
        color: #15803d;
      }

      .error {
        color: #dc2626;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>NestJS API 테스트</h1>

      <p class="description">
        NestJS + TypeORM + MySQL을 활용한 회원 및 평점 API 테스트
      </p>

      <!-- 닉네임 중복 체크 -->
      <section class="card">
        <h2>1. 닉네임 중복 체크</h2>

        <p class="endpoint">GET /members/nickname/:nickname</p>

        <div class="input-group">
          <input
            type="text"
            id="nickname"
            placeholder="닉네임을 입력하세요"
            value="noco"
          />

          <button onclick="checkNickname()">중복 확인</button>
        </div>

        <pre id="nickname-result" class="result">결과가 여기에 표시됩니다.</pre>
      </section>

      <!-- 이메일 중복 체크 -->
      <section class="card">
        <h2>2. 이메일 중복 체크</h2>

        <p class="endpoint">GET /members/email/:email</p>

        <div class="input-group">
          <input
            type="email"
            id="email"
            placeholder="이메일을 입력하세요"
            value="noco@umc.com"
          />

          <button onclick="checkEmail()">중복 확인</button>
        </div>

        <pre id="email-result" class="result">결과가 여기에 표시됩니다.</pre>
      </section>

      <!-- 유저별 평점 조회 -->
      <section class="card">
        <h2>3. 유저별 평점 조회</h2>

        <p class="endpoint">GET /members/:memberId/ratings</p>

        <div class="input-group">
          <input
            type="number"
            id="memberId"
            placeholder="회원 ID를 입력하세요"
            value="1"
            min="1"
          />

          <button onclick="getMemberRatings()">평점 조회</button>
        </div>

        <pre id="ratings-result" class="result">결과가 여기에 표시됩니다.</pre>
      </section>
    </div>

    <script>
      const API_BASE_URL = "http://localhost:3000";

      // 공통 API 요청 함수
      async function requestApi(endpoint, resultId) {
        const resultElement = document.getElementById(resultId);

        resultElement.className = "result";
        resultElement.textContent = "데이터를 불러오는 중...";

        try {
          const response = await fetch(`${API_BASE_URL}${endpoint}`);

          if (!response.ok) {
            throw new Error(`HTTP 오류: ${response.status}`);
          }

          const data = await response.json();

          resultElement.textContent = JSON.stringify(data, null, 2);
          resultElement.classList.add("success");

          console.log(`API 요청 성공: ${endpoint}`, data);
        } catch (error) {
          resultElement.textContent = `요청 실패: ${error.message}`;
          resultElement.classList.add("error");

          console.error(`API 요청 실패: ${endpoint}`, error);
        }
      }

      // 1. 닉네임 중복 체크
      function checkNickname() {
        const nickname = document.getElementById("nickname").value.trim();

        if (!nickname) {
          alert("닉네임을 입력하세요.");
          return;
        }

        requestApi(
          `/members/nickname/${encodeURIComponent(nickname)}`,
          "nickname-result"
        );
      }

      // 2. 이메일 중복 체크
      function checkEmail() {
        const email = document.getElementById("email").value.trim();

        if (!email) {
          alert("이메일을 입력하세요.");
          return;
        }

        requestApi(
          `/members/email/${encodeURIComponent(email)}`,
          "email-result"
        );
      }

      // 3. 유저별 평점 조회
      function getMemberRatings() {
        const memberId = document.getElementById("memberId").value.trim();

        if (!/^[1-9]\d*$/.test(memberId)) {
          alert("올바른 회원 ID를 입력하세요.");
          return;
        }

        requestApi(
          `/members/${memberId}/ratings`,
          "ratings-result"
        );
      }
    </script>
  </body>
</html>
