spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/movie}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:validate}"

jwt:
  secret: "${JWT_SECRET:}"
  access-expiration: "${JWT_ACCESS_EXPIRATION:3600}"
