<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icons/movie.svg" />
    <title>순수 fetch 실습 · UMCine</title>
  </head>
  <body class="bg-[#f5f7f9] text-[#15171a]">
    <main class="mx-auto max-w-4xl px-5 py-12">
      <a class="text-sm text-blue-700 underline" href="/">UMCine으로 돌아가기</a>
      <h1 class="mt-8 text-2xl font-bold">순수 fetch로 인기 영화 요청하기</h1>
      <p class="mt-4 text-sm leading-7 text-slate-600">DevTools의 Network 패널을 연 뒤 아래 버튼을 누르세요. Fetch/XHR에서 popular 요청을 선택하고 Headers와 Response를 확인할 수 있습니다. 이 페이지는 ky를 사용하지 않습니다.</p>
      <button class="mt-6 rounded-md bg-[#1c2027] px-5 py-3 text-sm font-bold text-white disabled:opacity-50" id="request-button" type="button">인기 영화 요청 (fetch)</button>
      <p class="mt-6 text-sm font-medium" id="request-status" role="status" aria-live="polite">아직 요청하지 않았습니다.</p>
      <pre class="mt-4 max-h-[65vh] overflow-auto rounded-lg border border-slate-200 bg-white p-5 text-xs leading-6" id="response-output">응답이 여기에 표시됩니다.</pre>
    </main>
    <script type="module" src="/src/labs/fetch-popular.ts"></script>
  </body>
</html>
