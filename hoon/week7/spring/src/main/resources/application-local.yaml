spring:
  datasource:
    url: jdbc:h2:mem:servicedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:umc-11th-movie-rating-secret-key-please-change-me}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
